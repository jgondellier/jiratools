# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    annotations: false
    http_method_override: false
    handle_all_throwables: true

    # Enables session support. Note that the session will ONLY be started if you read or write from it.
    # Remove or comment this section to explicitly disable session support.
    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax

    #esi: true
    #fragments: true
    php_errors:
        log: true

    # Options de connexion HTTP communes aux appels Jira et Confluence (voir .env)
    http_client:
        default_options:
            verify_peer: '%env(bool:APP_HTTP_VERIFY_PEER)%'
            verify_host: '%env(bool:APP_HTTP_VERIFY_HOST)%'
            cafile: '%env(default::APP_HTTP_CAFILE)%'
            proxy: '%env(default::APP_HTTP_PROXY)%'
            no_proxy: '%env(default::APP_HTTP_NO_PROXY)%'
            timeout: '%env(float:APP_HTTP_TIMEOUT)%'

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
