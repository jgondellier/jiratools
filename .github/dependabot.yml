# Mises à jour automatiques des dépendances (PR hebdomadaires groupées)
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      symfony:
        patterns: ["symfony/*"]
      autres:
        patterns: ["*"]
        exclude-patterns: ["symfony/*"]
